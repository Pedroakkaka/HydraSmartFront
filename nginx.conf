# HydraSmart Front — nginx de produção
# Serve o painel (React) e repassa /api, /ws e /docs para a HydraSmart API.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream hydrasmart_api {
  # Nome do serviço da API na rede Docker "hydrasmart" (ver docker-compose.yml)
  server ${API_UPSTREAM};
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Arquivos com hash no nome podem ficar em cache por 1 ano
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://hydrasmart_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /ws {
    proxy_pass http://hydrasmart_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /docs {
    proxy_pass http://hydrasmart_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Rotas do React (ex.: /mapa, /graficos) sempre caem no index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
